name: CI - lint, test, train, docker

on:
  push:            # every branch, so a failing branch shows a red run
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 src tests scripts

      - name: Unit tests (pytest)
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov=src --cov-report=xml:reports/coverage.xml \
                 --cov-report=term-missing

      - name: Prepare data (uses committed raw CSV, downloads only if missing)
        run: python scripts/download_data.py

      - name: Train models (MLflow tracking)
        run: python -m src.train

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/*.xml

      - name: Upload trained model + MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: model-and-mlruns
          path: |
            models/
            mlruns/

  docker:
    needs: lint-test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model-and-mlruns
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image (scikit-learn version taken from the trained model metadata)
        run: |
          SK=$(python -c "import json; print(json.load(open('models/model_metadata.json'))['sklearn_version'])")
          docker build --build-arg SKLEARN_VERSION=$SK -t heart-disease-api:ci .

      - name: Run container and smoke-test /predict
        run: |
          docker run -d --name api -p 8000:8000 heart-disease-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}'
          docker logs api
