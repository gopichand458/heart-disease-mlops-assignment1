apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy,
         url: "http://prometheus:9090", isDefault: true}
  provider.yml: |
    apiVersion: 1
    providers:
      - {name: heart-api, folder: "", type: file, options: {path: /var/lib/grafana/dashboards}}
---
# The ConfigMap "grafana-dashboards" is created from monitoring/grafana/dashboards/
# by scripts/deploy_k8s.sh (kubectl create configmap --from-file).
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: datasource, mountPath: /etc/grafana/provisioning/dashboards/provider.yml, subPath: provider.yml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: datasource
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
